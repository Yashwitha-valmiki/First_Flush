AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FirstFlush India API
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 512
Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type']
        AllowMethods: ['GET','POST','OPTIONS']
  FirstFlushApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: server.lambdaHandler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
